# Tashner Home Hub. Works unchanged on Unraid (amd64) and the Mac Studio (arm64).
# Config comes from an optional .env next to this file (see .env.example).
services:
  hub:
    image: ghcr.io/davetashner/tashner-home-hub:${HUB_TAG:-latest}
    build: . # fallback when the image is not published/pulled
    init: true
    labels:
      # Unraid's Docker page shows this icon for compose-managed containers.
      net.unraid.docker.icon: https://raw.githubusercontent.com/davetashner/tashner-home-hub/main/static/icon-256.png
    restart: unless-stopped
    # Run as a non-root user that owns the bind mount. Defaults to the image's
    # `node` user (1000:1000). On Unraid set PUID=99 PGID=100 (nobody:users).
    user: '${PUID:-1000}:${PGID:-1000}'
    ports:
      - '${HUB_PORT:-3000}:3000'
    volumes:
      - ${HUB_DATA_DIR:-./data}:/data
      # Photo frame source (read-only). Point the host side at your photo folder/share, e.g.
      # Unraid: /mnt/user/Photos   Mac Studio: /Users/<you>/HubPhotos (osxphotos export target).
      # Then add /media/photos-in in Settings > Photo library. Override the allowed container
      # paths with HUB_PHOTO_ROOTS (comma-separated) in .env.
      - ${HUB_PHOTO_DIR:-./photo-library}:/media/photos-in:ro
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
