# ADR 0002 — Tier 1 gates. Job names are required status checks on `main`:
# do not rename them without updating branch protection. Protected path.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  repo-gates:
    name: repo-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl
      - name: PR hygiene (DCO, Closes line, PR size)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/pr-hygiene.mjs
      - name: Gate integrity (protected files)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/gate-integrity.mjs
      - name: Test integrity (.only, skips, deleted tests)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/test-integrity.mjs
      - name: Runner PR-event guard (ADR 0002)
        run: node scripts/ci/self-hosted-guard.mjs
      - name: Private data (public repo)
        run: node scripts/ci/private-data.mjs
      - name: Secret scan (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner --exit-code 1 /repo

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types (svelte-check, strict)
        run: pnpm check
      - name: Lint and format
        run: pnpm lint
      - name: Animation hygiene and design-system discipline
        run: pnpm lint:css
      - name: Unit tests with coverage thresholds
        run: pnpm test
      - name: Dependency vulnerabilities (high and critical)
        run: pnpm audit --audit-level high
      - name: Licenses
        run: node scripts/ci/licenses.mjs
      - name: Build
        run: pnpm build
      - name: Bundle budget (budgets.json)
        run: pnpm budget

  # Split across two runners: each shard builds and runs its own server and database, which
  # halves the wall-clock time and keeps the shards from seeing each other's test data.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end incl. accessibility (landscape + portrait)
        # Perf gates run alone in e2e-perf: sharing a runner with other tests skews their timings.
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2 --grep-invert @perf
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # The perf gates (tagged @perf) measure our own scripting at 4x CPU throttle, so they run on
  # their own runner with one worker: CPU contention from parallel tests would skew them.
  e2e-perf:
    name: e2e (perf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Perf gates (one worker)
        run: pnpm test:e2e --grep @perf --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-perf
          path: playwright-report
          retention-days: 7

  # Keeps the required "e2e" status check: passes only when both shards and the perf job passed.
  e2e:
    name: e2e
    needs: [e2e-shard, e2e-perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both shards and the perf gates passed
        run: |
          test "${{ needs.e2e-shard.result }}" = "success"
          test "${{ needs.e2e-perf.result }}" = "success"

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: home-hub:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (healthy within 30s)
        run: |
          docker run -d --name hub -p 3000:3000 home-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs hub
          exit 1
